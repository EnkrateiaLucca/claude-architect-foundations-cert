# Six distractor patterns

| Pattern | Sounds like |
|---|---|
| Prompt as policy | "Make it mandatory in the system prompt." |
| Over-engineering | "Add a routing classifier." "Train a model on old tickets." |
| Bigger model | "Higher-tier model with a larger context window." |
| Unreliable proxy | "Self-reported confidence 1–10." "Sentiment analysis." |
| Invented feature | `CLAUDE_HEADLESS=true` · `--batch` · `.claude/config.json` |
| Hide or kill the error | "Return empty as success." "Terminate the workflow." |

**Right answer: the proportionate fix at the root cause.**

???
Every pattern comes from wrong options in the twelve official samples.

"Proportionate first response" and "root cause" appear again and again in the guide's explanations. If an option needs new infrastructure before the cheap fix has been tried, it's usually wrong.

# The agentic loop runs on `stop_reason`

```
while True:
    resp = client.messages.create(model=MODEL, tools=tools, messages=messages)
    messages.append({"role": "assistant", "content": resp.content})
    if resp.stop_reason != "tool_use":      # "end_turn" → done
        break
    results = [run_tool(b) for b in resp.content if b.type == "tool_use"]
    messages.append({"role": "user", "content": results})
```

| Anti-pattern | Why it fails |
|---|---|
| Parse the text for "done" | Natural language is not a control signal |
| Iteration cap as the main stop | Cuts off valid work; use it only as a safety net |
| "Has text content" = finished | Claude can emit text *and* call tools |

???
Task statement 1.1. Continue on "tool_use", terminate on "end_turn". Tool results go back into the conversation so the model can reason about the next step.

Model-driven decisions (Claude picks the next tool from context) vs pre-configured decision trees.

# Coordinator and subagents: hub-and-spoke

.two-col[
<div>
<div class="col-head green">THE COORDINATOR</div>
<ul>
<li>Decomposes, delegates, aggregates</li>
<li>Picks subagents by query complexity</li>
<li>Routes <strong>all</strong> inter-agent traffic</li>
<li>Sets goals + quality criteria, not steps</li>
<li>Re-delegates when synthesis shows gaps</li>
</ul>
</div>
<div>
<div class="col-head blue">THE SUBAGENTS</div>
<ul>
<li>Spawned via the <code>Task</code> tool</li>
<li><code>allowedTools</code> must include <code>"Task"</code></li>
<li>Isolated context: <strong>no inherited history</strong></li>
<li>Get prior findings pasted into the prompt</li>
<li>Parallel = many <code>Task</code> calls in <strong>one</strong> response</li>
</ul>
</div>
]

**Subagents start with only what you pass them.** Use structured data so source URLs and page numbers survive.

???
Task statements 1.2 and 1.3.

AgentDefinition: description, system prompt, tool restrictions per subagent type.

Classic trap: narrow decomposition by the coordinator. Every subagent succeeds, the report still misses half the topic. Official sample 7 tests exactly this.

Partition scope to minimize duplication: distinct subtopics or source types per agent.

# Enforce in code, not in the prompt

| Need | Mechanism |
|---|---|
| Verify identity before refunds | **Prerequisite gate**: block `process_refund` until `get_customer` returns a verified ID |
| Block refunds over $500 | **Tool-call interception hook** → redirect to human escalation |
| Normalize Unix / ISO 8601 / status codes | **PostToolUse hook** transforms results before the model sees them |
| Hand off to a human mid-process | **Structured summary**: customer ID, root cause, amount, recommended action |
| Multi-concern request | Split into items, investigate in parallel, synthesize one answer |

*Prompt instructions have a non-zero failure rate. Hooks are deterministic.*

???
Task statements 1.4 and 1.5.

"When deterministic compliance is required (e.g., identity verification before financial operations), prompt instructions alone have a non-zero failure rate."

The human agent who takes the handoff has no access to the transcript. The summary must stand alone.

---

class: dense

# Decompose and manage sessions

| Situation | Choose |
|---|---|
| Predictable multi-aspect review | **Prompt chaining**: fixed sequential passes |
| Open-ended investigation | **Dynamic decomposition**: map, prioritize, adapt |
| Big code review | Per-file local passes + one cross-file integration pass |
| Continue yesterday's investigation | `--resume <session-name>` |
| Compare two approaches from one baseline | `fork_session` |
| Prior tool results are stale | New session + injected structured summary |
| Files changed since last session | Resume and name the changed files |

???
Task statements 1.6 and 1.7.

"Add comprehensive tests to a legacy codebase": map structure first, find high-impact areas, then a prioritized plan that adapts as dependencies appear.

Resume when prior context is mostly valid. Start fresh with a summary when tool results are stale.

.stem[Production data shows that in 12% of cases, your agent skips get_customer entirely and calls lookup_order using only the customer's stated name, occasionally leading to misidentified accounts and incorrect refunds. What change would most effectively address this reliability issue?]

.options[

- **B.** Enhance the system prompt to state that customer verification via get_customer is mandatory before any order operations.
- **C.** Add few-shot examples showing the agent always calling get_customer first, even when customers volunteer order details.
- **D.** Implement a routing classifier that analyzes each request and enables only the subset of tools appropriate for that request type.
]

.q-label[Official sample 1 · Answer]

.correct[A · Programmatic prerequisite gate]

| Option | Pattern | Why it fails |
|---|---|---|
| B | Prompt as policy | Probabilistic compliance; errors cost money |
| C | Prompt as policy | Few-shot is still probabilistic |
| D | Over-engineering | Fixes tool availability, not tool ordering |

*Required sequence + financial stakes → enforce in code.*

# Explicit criteria, then examples

| Vague (fails) | Explicit (works) |
|---|---|
| "Check that comments are accurate" | "Flag a comment only when its claimed behavior contradicts the code" |
| "Be conservative" | Report bugs and security; skip minor style and local patterns |
| "Only high-confidence findings" | Severity levels, each with a concrete code example |

**Few-shot: 2–4 targeted examples** for the ambiguous cases, showing *why* one action beat the alternatives. They fix format drift, cut false positives, and reduce empty or invented extraction fields.

*False positives in one category erode trust in all of them.* Disable that category while you fix its prompt.

# Schema-valid isn't the same as correct

```
{"name": "extract_invoice", "input_schema": {"type": "object",
  "properties": {
    "stated_total":     {"type": "number"},
    "calculated_total": {"type": "number"},
    "due_date":         {"type": ["string", "null"]},
    "category": {"enum": ["services", "goods", "other", "unclear"]},
    "category_detail":  {"type": ["string", "null"]}},
  "required": ["stated_total", "calculated_total", "category"]}}
```

- `tool_use` + JSON schema **removes syntax errors**, not semantic ones
- **Nullable** fields stop the model inventing values to fill required ones
- `"other"` + detail and `"unclear"` keep categories honest
- Unknown doc type → `tool_choice: "any"`; must run first → force the tool

| Failure | Retry helps? | Do |
|---|---|---|
| Format mismatch | **Yes** | Resend document + failed output + the specific validation error |
| Structural output error | **Yes** | Same, with the error message |
| Totals don't add up | Sometimes | Extract `calculated_total` beside `stated_total`; flag conflicts |
| Info only in a document you didn't send | **No** | Return null or route to a human |
| Developers keep dismissing a finding | n/a | Log `detected_pattern` and analyze the dismissals |

| | Synchronous API | Message Batches API |
|---|---|---|
| Cost | Standard | **50% off** |
| Latency | Seconds | Up to **24 h**, no SLA |
| Multi-turn tool calls | Yes | **No** |

# Read the trigger, not the options

| Cue in the stem | Points to |
|---|---|
| "financial", "must always", "guaranteed" | Hook or prerequisite gate |
| "minimal descriptions", "similar tools" | Rewrite or split tool descriptions |
| "every developer who clones" | `.claude/commands/`, project CLAUDE.md |
| "regardless of location" | `.claude/rules/` with globs |
| "dozens of files", "service boundaries" | Plan mode |
| "hangs", "waiting for input" | `-p` |
| "overnight", "not blocking" | Message Batches API |
| "inconsistent depth", "contradictory" | Per-file + integration passes |
| "all subagents succeeded, still incomplete" | Coordinator decomposition |
| "absent from the source" | Nullable field, not a retry |

???
Time: 2 min per item. Item 20 at 40 min, item 40 at 80, item 60 at 120. Flag anything over 3 min.

Read the last sentence first. Predict before reading options. Multiple-response: each option is its own true/false; assume all-or-nothing.

# If you remember seven things

.takeaways[
<ol>
<li><span class="num">1</span><div class="body"><strong>Loop on <code>stop_reason</code>.</strong><span>"tool_use" continues, "end_turn" stops. Never parse text.</span></div></li>
<li><span class="num">2</span><div class="body"><strong>Subagents know only what you pass them.</strong><span>Paste findings in. Fan out in one response.</span></div></li>
<li><span class="num">3</span><div class="body"><strong>Hard rules go in hooks, not prompts.</strong><span>Judgment calls go in criteria + examples.</span></div></li>
<li><span class="num">4</span><div class="body"><strong>The description is the router.</strong><span>Fewer, sharper tools. Structured, categorized errors.</span></div></li>
<li><span class="num">5</span><div class="body"><strong>Put config at the right layer.</strong><span>Project vs user. Rules by glob. <code>-p</code> in CI.</span></div></li>
<li><span class="num">6</span><div class="body"><strong>Schema-valid isn't correct.</strong><span>Nullable fields, targeted retries, batch what can wait.</span></div></li>
<li><span class="num">7</span><div class="body"><strong>Keep facts, sources, and errors explicit.</strong><span>Case facts, provenance, coverage gaps, human routing.</span></div></li>
</ol>
]
